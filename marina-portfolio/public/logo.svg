<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f0a13"/>
      <stop offset="1" stop-color="#4a1729"/>
    </linearGradient>
    <linearGradient id="mstroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c05d78"/>
      <stop offset="1" stop-color="#e6bd63"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="200" height="200" rx="40" fill="url(#bg)"/>

  <!-- letter M -->
  <path d="M48 150 L48 55 L100 105 L152 55 L152 150"
        fill="none" stroke="url(#mstroke)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- neural links from the M apex -->
  <line x1="100" y1="105" x2="76" y2="80" stroke="#f2d38a" stroke-width="3"/>
  <line x1="100" y1="105" x2="124" y2="80" stroke="#f2d38a" stroke-width="3"/>

  <circle cx="76" cy="80" r="6" fill="#f2d38a"/>
  <circle cx="124" cy="80" r="6" fill="#f2d38a"/>

  <!-- center node -->
  <circle cx="100" cy="105" r="11" fill="#e6bd63"/>
</svg>
